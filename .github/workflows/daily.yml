name: 일일 의료 포털 자동화

on:
  schedule:
    - cron: '1 12 * * *'  # 매일 21:01 KST (UTC 12:01)
  workflow_dispatch:        # 수동 실행 (Actions 탭 → "Run workflow")

permissions:
  contents: write

jobs:
  daily-routine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: 단위 테스트 실행
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest

      - name: credentials.json 생성
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > credentials.json

      - name: Telegram Inbox 수신
        id: inbox
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --fetch

      - name: quiz_answers_legacy.json 커밋 및 푸시
        id: commit_inbox
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain quiz_answers_legacy.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_answers_legacy.json
            git commit -m "chore: update legacy quiz answers from telegram inbox [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Telegram Inbox Offset 확정
        if: steps.inbox.outputs.next_offset != '' && steps.commit_inbox.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --confirm-offset "${{ steps.inbox.outputs.next_offset }}"

      - name: 일일 자동화 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python3 scripts/daily_runner.py --headed

      - name: quiz_answers.json 자동 커밋
        if: always()
        run: |
          if [ -n "$(git status --porcelain quiz_answers.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_answers.json
            git commit -m "chore: update quiz answers bank from run [skip ci]"
            git pull --rebase
            git push
          fi

      - name: 스크린샷 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: scripts/logs/
          if-no-files-found: ignore
          retention-days: 7
