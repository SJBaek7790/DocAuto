name: 닥터빌 라이브 세미나 수동 입장

on:
  schedule:
    - cron: '0,30 1-4 * * *'  # 점심 세미나 (KST 10:00~13:30, UTC 01:00~04:30)
    - cron: '0,30 7-9 * * *'  # 저녁 세미나 (KST 16:00~18:30, UTC 07:00~09:30)
  workflow_dispatch:
    inputs:
      account:
        description: "대상 계정"
        type: choice
        options:
          - all
          - bjh7790
          - wonju
        default: all
      stay_seconds:
        description: "세미나 팝업 체류 시간(초)"
        type: string
        default: "20"
      ignore_state:
        description: "상태 파일 무시하고 전체 시도"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seminar-live
  cancel-in-progress: false

jobs:
  seminar-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KST 날짜 설정
        run: echo "KST_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: 세미나 상태 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: scripts/state
          key: seminar-state-${{ env.KST_DATE }}-${{ github.run_id }}
          restore-keys: |
            seminar-state-${{ env.KST_DATE }}-

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: 단위 테스트 실행
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest

      - name: credentials.json 생성
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > credentials.json

      - name: Telegram Inbox 수신
        id: inbox
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --fetch

      - name: quiz_answers_legacy.json 커밋 및 푸시
        id: commit_inbox
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain quiz_answers_legacy.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_answers_legacy.json
            git commit -m "chore: update legacy quiz answers from telegram inbox [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Telegram Inbox Offset 확정
        if: steps.inbox.outputs.next_offset != '' && steps.commit_inbox.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --confirm-offset "${{ steps.inbox.outputs.next_offset }}"

      - name: 라이브 세미나 입장 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a python3 scripts/seminar_live.py \
            --account ${{ inputs.account || 'all' }} \
            --stay-seconds ${{ inputs.stay_seconds || '20' }} \
            --block auto \
            --state-file scripts/state/seminar_entered.json \
            ${{ inputs.ignore_state && '--ignore-state' || '' }} \
            --headed

      - name: 세미나 상태 캐시 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/state
          key: seminar-state-${{ env.KST_DATE }}-${{ github.run_id }}

      - name: 스크린샷 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seminar-live-logs-${{ github.run_number }}
          path: scripts/logs/
          if-no-files-found: ignore
          retention-days: 7
