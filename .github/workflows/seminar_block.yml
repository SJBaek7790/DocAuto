name: 닥터빌 라이브 세미나 블록 실행

on:
  workflow_dispatch:
    inputs:
      account:
        description: "대상 계정"
        type: choice
        options:
          - all
          - bjh7790
          - wonju
        default: all
      stay_seconds:
        description: "세미나 팝업 체류 시간(초)"
        type: string
        default: "20"
      ignore_state:
        description: "상태 파일 무시하고 전체 시도"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seminar-block
  cancel-in-progress: false

env:
  NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}

jobs:
  seminar-block:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KST 날짜/시각 설정
        run: |
          echo "KST_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "KST_HOUR=$(TZ='Asia/Seoul' date +'%H')" >> $GITHUB_ENV

      - name: 세미나 상태 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: scripts/state
          key: seminar-state-${{ env.KST_DATE }}-${{ github.run_id }}
          restore-keys: |
            seminar-state-${{ env.KST_DATE }}-

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: 단위 테스트 실행
        continue-on-error: true
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest

      - name: credentials.json 생성
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: echo "$CREDENTIALS_JSON" > credentials.json

      # Step 1: Telegram Inbox 수신 (11:00 KST 런 전용)
      - name: Telegram Inbox 수신 (11시 KST 런 전용)
        if: env.KST_HOUR == '11'
        id: inbox
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --fetch

      - name: 인박스 결과 커밋 및 푸시
        if: env.KST_HOUR == '11'
        id: commit_inbox
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain quiz_answers_legacy.json intermd_answer.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quiz_answers_legacy.json intermd_answer.json
            git commit -m "chore: update quiz answers from telegram inbox [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Telegram Inbox Offset 확정
        if: env.KST_HOUR == '11' && steps.inbox.outputs.next_offset != '' && steps.commit_inbox.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py --confirm-offset "${{ steps.inbox.outputs.next_offset }}"

      # Step 2: 닥터빌 세미나 신청 실행
      - name: 닥터빌 세미나 신청 실행
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: |
          if [ "${{ inputs.account || 'all' }}" = "all" ]; then
            xvfb-run -a python3 scripts/doctorville.py --task seminar --account bjh7790 --headed || true
            xvfb-run -a python3 scripts/doctorville.py --task seminar --account wonju --headed || true
          else
            xvfb-run -a python3 scripts/doctorville.py --task seminar --account ${{ inputs.account }} --headed || true
          fi

      # Step 3: 라이브 세미나 입장 실행
      - name: 라이브 세미나 입장 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: |
          xvfb-run -a python3 scripts/seminar_live.py \
            --account ${{ inputs.account || 'all' }} \
            --stay-seconds ${{ inputs.stay_seconds || '20' }} \
            --block auto \
            --state-file scripts/state/seminar_entered.json \
            ${{ inputs.ignore_state && '--ignore-state' || '' }} \
            --headed

      # Step 4: 세미나 설문조사 실행
      - name: 세미나 설문조사 실행
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
        run: |
          xvfb-run -a python3 scripts/seminar_survey.py \
            --account ${{ inputs.account || 'all' }} \
            --state-file scripts/state/seminar_entered.json \
            --headed

      - name: survey_answers.json 커밋 및 푸시
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain survey_answers.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add survey_answers.json
            git commit -m "chore: collect unanswered survey questions [skip ci]"
            git pull --rebase
            git push
          fi

      - name: 세미나 상태 캐시 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/state
          key: seminar-state-${{ env.KST_DATE }}-${{ github.run_id }}

      - name: 스크린샷 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seminar-block-logs-${{ github.run_number }}
          path: scripts/logs/
          if-no-files-found: ignore
          retention-days: 7
